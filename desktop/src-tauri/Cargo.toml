[package]
name = "organizer-desktop"
version = "0.1.0"
description = "Organizer desktop app (Tauri shell)"
authors = ["You <you@example.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["api-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
html-escape = "0.2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "gzip", "rustls-tls"] }
scraper = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

# We'll wire these in next steps for backend reuse.
# organizer-core = { path = "../../crates/core" }
# storage = { path = "../../crates/storage" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
